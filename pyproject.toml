[project]
name = "mcnet"
license = "MIT"
version = "0.1.0"
description = "Declarative manager for Minecraft server networks: one manifest, a lockfile, reproducible plugin installs from Modrinth and Hangar."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcnet"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "ruff>=0.15.22",
]

[project.scripts]
mcnet = "mcnet.cli.app:app"
