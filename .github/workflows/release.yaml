name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            built: mcnet.exe
            asset: mcnet-windows.exe
          - os: ubuntu-latest
            built: mcnet
            asset: mcnet-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Build executable
        run: uv run pyinstaller --onefile --name mcnet src/mcnet/__main__.py
      - name: Rename for the target system
        run: mv dist/${{ matrix.built }} dist/${{ matrix.asset }}
        shell: bash
      - name: Take this version's notes from the changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $1 == "##" && $2 == v { found = 1; next }
            found && $1 == "##"   { exit }
            found                 { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
          cat notes.md
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          body_path: notes.md